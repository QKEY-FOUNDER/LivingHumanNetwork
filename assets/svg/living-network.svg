<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="1600" xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#f7e08a"/>
    <stop offset="50%" stop-color="#d4af37"/>
    <stop offset="100%" stop-color="#b8860b"/>
  </linearGradient>
</defs>

<!-- Background -->
<rect width="100%" height="100%" fill="#f2e6c9"/>

<!-- Trunk -->
<rect x="575" y="500" width="50" height="700" fill="#5c3b1e"/>

<!-- ROOT LEFT -->
<rect x="200" y="1300" width="250" height="70" rx="10" fill="url(#goldGradient)" stroke="#8c6a00"/>
<rect x="200" y="1380" width="250" height="70" rx="10" fill="url(#goldGradient)" stroke="#8c6a00"/>
<rect x="200" y="1460" width="250" height="70" rx="10" fill="url(#goldGradient)" stroke="#8c6a00"/>

<!-- ROOT RIGHT -->
<rect x="750" y="1300" width="250" height="70" rx="10" fill="url(#goldGradient)" stroke="#8c6a00"/>
<rect x="750" y="1380" width="250" height="70" rx="10" fill="url(#goldGradient)" stroke="#8c6a00"/>
<rect x="750" y="1460" width="250" height="70" rx="10" fill="url(#goldGradient)" stroke="#8c6a00"/>

<!-- PARENTS LAYER -->
<rect x="350" y="1150" width="250" height="70" rx="10" fill="url(#goldGradient)" stroke="#8c6a00"/>
<rect x="600" y="1150" width="250" height="70" rx="10" fill="url(#goldGradient)" stroke="#8c6a00"/>

<!-- SIBLINGS LAYER -->
<rect x="250" y="1000" width="250" height="70" rx="10" fill="url(#goldGradient)" stroke="#8c6a00"/>
<rect x="700" y="1000" width="250" height="70" rx="10" fill="url(#goldGradient)" stroke="#8c6a00"/>

</svg>
