<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LivingHumanNetwork v4.3 — Generational Power Shift Model</title>
<style>
body { margin:0; font-family:Arial; background:#d8cdb0; text-align:center; }
h1 { margin-top:20px; }
#metrics { margin:10px; font-size:14px; }
svg { background:#d8cdb0; }
</style>
</head>
<body>

<h1>LivingHumanNetwork v4.3 — Generational Power Shift</h1>
<div id="metrics"></div>
<svg id="network" width="900" height="600"></svg>

<script>

const nodes = [
{ id:"M", name:"Mihail" },
{ id:"N", name:"Natalia" },
{ id:"V", name:"Vladislav" },
{ id:"P", name:"Paulo" },
{ id:"C", name:"CHIOSS REALTY" }
];

const edges = [
{ source:"M", target:"N" },
{ source:"N", target:"V" },
{ source:"M", target:"V" },
{ source:"N", target:"P" },
{ source:"M", target:"P" },
{ source:"V", target:"C" },
{ source:"P", target:"C" },
{ source:"C", target:"M" }
];

function buildAdj(){
let adj = {};
nodes.forEach(n=>adj[n.id]=[]);
edges.forEach(e=>{
adj[e.source].push(e.target);
adj[e.target].push(e.source);
});
return adj;
}

function degree(id){
return edges.filter(e=>e.source===id||e.target===id).length;
}

function betweenness(){
let adj = buildAdj();
let CB = {};
nodes.forEach(n=>CB[n.id]=0);

if(nodes.length<3) return CB;

nodes.forEach(s=>{
let S=[], P={}, sigma={}, d={}, Q=[];
nodes.forEach(v=>{
P[v.id]=[];
sigma[v.id]=0;
d[v.id]=-1;
});
sigma[s.id]=1;
d[s.id]=0;
Q.push(s.id);

while(Q.length){
let v=Q.shift();
S.push(v);
adj[v].forEach(w=>{
if(d[w]<0){
Q.push(w);
d[w]=d[v]+1;
}
if(d[w]===d[v]+1){
sigma[w]+=sigma[v];
P[w].push(v);
}
});
}

let delta={};
nodes.forEach(v=>delta[v.id]=0);

while(S.length){
let w=S.pop();
P[w].forEach(v=>{
delta[v]+= (sigma[v]/sigma[w])*(1+delta[w]);
});
if(w!==s.id){
CB[w]+=delta[w];
}
}
});

let norm=1/((nodes.length-1)*(nodes.length-2));
nodes.forEach(n=>CB[n.id]*=norm);

return CB;
}

function countComponents(exclude=null){
let adj=buildAdj();
let visited=new Set();
let components=0;

nodes.forEach(n=>{
if(n.id!==exclude && !visited.has(n.id)){
components++;
let stack=[n.id];
while(stack.length){
let v=stack.pop();
if(!visited.has(v)){
visited.add(v);
adj[v].forEach(w=>{
if(w!==exclude && !visited.has(w)){
stack.push(w);
}
});
}
}
}
});

return components;
}

function clustering(){
let adj=buildAdj();
let total=0;

nodes.forEach(n=>{
let neighbors=adj[n.id];
let k=neighbors.length;
if(k<2) return;
let links=0;
for(let i=0;i<k;i++){
for(let j=i+1;j<k;j++){
if(adj[neighbors[i]].includes(neighbors[j])) links++;
}
}
total+= (2*links)/(k*(k-1));
});

return (total/nodes.length);
}

function draw(){

let svg=document.getElementById("network");
svg.innerHTML="";

let positions={
M:{x:450,y:250},
N:{x:250,y:250},
V:{x:250,y:450},
P:{x:650,y:450},
C:{x:650,y:250}
};

edges.forEach(e=>{
let line=document.createElementNS("http://www.w3.org/2000/svg","line");
line.setAttribute("x1",positions[e.source].x);
line.setAttribute("y1",positions[e.source].y);
line.setAttribute("x2",positions[e.target].x);
line.setAttribute("y2",positions[e.target].y);
line.setAttribute("stroke","#555");
line.setAttribute("stroke-width","2");
svg.appendChild(line);
});

let btw=betweenness();
let maxB=Math.max(...Object.values(btw));

nodes.forEach(n=>{
let r=20+degree(n.id)*8;
let intensity=maxB===0?0:btw[n.id]/maxB;
let red=Math.floor(255*intensity);
let blue=255-red;

let circle=document.createElementNS("http://www.w3.org/2000/svg","circle");
circle.setAttribute("cx",positions[n.id].x);
circle.setAttribute("cy",positions[n.id].y);
circle.setAttribute("r",r);
circle.setAttribute("fill","rgb("+red+",0,"+blue+")");
circle.setAttribute("stroke","#222");
circle.setAttribute("stroke-width","2");
svg.appendChild(circle);

let text=document.createElementNS("http://www.w3.org/2000/svg","text");
text.setAttribute("x",positions[n.id].x);
text.setAttribute("y",positions[n.id].y+4);
text.setAttribute("text-anchor","middle");
text.setAttribute("fill","#fff");
text.setAttribute("font-size","12");
text.textContent=n.name;
svg.appendChild(text);
});

let mostCentral=nodes.reduce((a,b)=>btw[a.id]>btw[b.id]?a:b);
let frag=countComponents(mostCentral.id);

document.getElementById("metrics").innerHTML=
"Nodes: "+nodes.length+
" | Edges: "+edges.length+
" | Density: "+((2*edges.length)/(nodes.length*(nodes.length-1))).toFixed(3)+
" | Avg Clustering: "+clustering().toFixed(3)+
" | Most Central: "+mostCentral.name+
" | Components After Removal: "+frag;
}

draw();

</script>
</body>
</html>
