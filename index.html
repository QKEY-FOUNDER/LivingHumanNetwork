<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LivingHumanNetwork v3.1 — Stable Analytical View</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #d8cfb3;
}

h2 {
    text-align: center;
    margin-top: 20px;
}

#metrics {
    text-align: center;
    margin-bottom: 10px;
    font-size: 14px;
}

svg {
    display: block;
    margin: auto;
    background: transparent;
}
</style>
</head>
<body>

<h2>LivingHumanNetwork v3.1 — Stable Analytical View</h2>
<div id="metrics"></div>

<svg width="900" height="600"></svg>

<script>

const width = 900;
const height = 600;
const svg = d3.select("svg");

fetch('data/living-human-network-v2.1.json')
.then(response => response.json())
.then(data => {

    const degree = {};
    data.nodes.forEach(n => degree[n.id] = 0);

    data.relationships.forEach(r => {
        degree[r.source] += 1;
        degree[r.target] += 1;
    });

    const maxDegree = Math.max(...Object.values(degree));

    const radiusScale = d3.scaleLinear()
        .domain([0, maxDegree])
        .range([20, 60]);

    // Detect connected components (communities)
    const visited = new Set();
    const components = {};
    let componentId = 0;

    function dfs(nodeId) {
        visited.add(nodeId);
        components[nodeId] = componentId;

        data.relationships.forEach(r => {
            if (r.source === nodeId && !visited.has(r.target)) dfs(r.target);
            if (r.target === nodeId && !visited.has(r.source)) dfs(r.source);
        });
    }

    data.nodes.forEach(n => {
        if (!visited.has(n.id)) {
            dfs(n.id);
            componentId++;
        }
    });

    const colorScale = d3.scaleOrdinal(d3.schemeCategory10);

    // Metrics
    const n = data.nodes.length;
    const m = data.relationships.length;
    const density = n > 1 ? ((2*m)/(n*(n-1))).toFixed(3) : 0;
    const avgDegree = (Object.values(degree).reduce((a,b)=>a+b,0)/n).toFixed(2);

    document.getElementById("metrics").innerHTML =
        `Nodes: ${n} | Edges: ${m} | Avg Degree: ${avgDegree} | Density: ${density}`;

    const simulation = d3.forceSimulation(data.nodes)
        .force("link", d3.forceLink(data.relationships)
            .id(d => d.id)
            .distance(150))
        .force("charge", d3.forceManyBody().strength(-400))
        .force("center", d3.forceCenter(width/2, height/2));

    const link = svg.append("g")
        .selectAll("line")
        .data(data.relationships)
        .enter()
        .append("line")
        .attr("stroke", "#999")
        .attr("stroke-width", 2);

    const node = svg.append("g")
        .selectAll("circle")
        .data(data.nodes)
        .enter()
        .append("circle")
        .attr("r", d => radiusScale(degree[d.id]))
        .attr("fill", d => colorScale(components[d.id]))
        .attr("stroke", "#333")
        .attr("stroke-width", 2)
        .call(d3.drag()
            .on("start", dragstarted)
            .on("drag", dragged)
            .on("end", dragended));

    const labels = svg.append("g")
        .selectAll("text")
        .data(data.nodes)
        .enter()
        .append("text")
        .text(d => d.label)
        .attr("text-anchor", "middle")
        .attr("font-size", 12)
        .attr("font-weight", "bold");

    simulation.on("tick", () => {

        link
            .attr("x1", d => d.source.x)
            .attr("y1", d => d.source.y)
            .attr("x2", d => d.target.x)
            .attr("y2", d => d.target.y);

        node
            .attr("cx", d => d.x)
            .attr("cy", d => d.y);

        labels
            .attr("x", d => d.x)
            .attr("y", d => d.y + 4);
    });

    function dragstarted(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
    }

    function dragged(event, d) {
        d.fx = event.x;
        d.fy = event.y;
    }

    function dragended(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null;
        d.fy = null;
    }

});

</script>
</body>
</html>
