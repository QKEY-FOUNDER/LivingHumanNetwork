<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LivingHumanNetwork v4.1 — Hybrid Analytical Engine</title>
<style>
body { margin:0; font-family:Arial; background:#d8cfb0; }
h2 { text-align:center; margin:20px 0 5px; }
.metrics { text-align:center; font-size:12px; margin-bottom:10px; }
</style>
</head>
<body>

<h2>LivingHumanNetwork v4.1 — Hybrid Analytical Engine</h2>
<div class="metrics" id="metrics"></div>
<svg id="network" width="100%" height="600"></svg>

<script>

const data = {
  nodes: [
    { id: "001", name: "Mihail", time: 0 },
    { id: "002", name: "Natalia", time: 0 }
  ],
  links: [
    { source: "001", target: "002", time: 0 }
  ]
};

function buildGraph(nodes, links){
  const adj = {};
  nodes.forEach(n => adj[n.id] = []);
  links.forEach(l => {
    adj[l.source].push(l.target);
    adj[l.target].push(l.source);
  });
  return adj;
}

function computeDegree(adj){
  const degree = {};
  Object.keys(adj).forEach(id => degree[id] = adj[id].length);
  return degree;
}

// Brandes Simplified for small graphs
function computeBetweenness(nodes, adj){

  const CB = {};
  nodes.forEach(n => CB[n.id] = 0);

  if(nodes.length < 3) return CB;

  nodes.forEach(s => {

    const S = [];
    const P = {};
    const sigma = {};
    const d = {};
    const Q = [];

    nodes.forEach(v => {
      P[v.id] = [];
      sigma[v.id] = 0;
      d[v.id] = -1;
    });

    sigma[s.id] = 1;
    d[s.id] = 0;
    Q.push(s.id);

    while(Q.length){
      const v = Q.shift();
      S.push(v);

      adj[v].forEach(w => {
        if(d[w] < 0){
          Q.push(w);
          d[w] = d[v] + 1;
        }
        if(d[w] === d[v] + 1){
          sigma[w] += sigma[v];
          P[w].push(v);
        }
      });
    }

    const delta = {};
    nodes.forEach(v => delta[v.id] = 0);

    while(S.length){
      const w = S.pop();
      P[w].forEach(v => {
        delta[v] += (sigma[v]/sigma[w]) * (1 + delta[w]);
      });
      if(w !== s.id){
        CB[w] += delta[w];
      }
    }

  });

  // normalização
  const norm = 1 / ((nodes.length-1)*(nodes.length-2));
  Object.keys(CB).forEach(id => CB[id] *= norm);

  return CB;
}

function render(){

  const svg = document.getElementById("network");
  svg.innerHTML = "";

  const adj = buildGraph(data.nodes, data.links);
  const degree = computeDegree(adj);
  const betweenness = computeBetweenness(data.nodes, adj);

  const maxDegree = Math.max(...Object.values(degree));
  const maxBet = Math.max(...Object.values(betweenness));

  const width = svg.clientWidth;
  const height = svg.clientHeight;

  const cx = width/2;
  const spacing = 200;

  const positions = {};
  data.nodes.forEach((n,i)=>{
    positions[n.id] = {
      x: cx + (i===0 ? -spacing/2 : spacing/2),
      y: height/2
    };
  });

  data.links.forEach(l=>{
    const line = document.createElementNS("http://www.w3.org/2000/svg","line");
    line.setAttribute("x1", positions[l.source].x);
    line.setAttribute("y1", positions[l.source].y);
    line.setAttribute("x2", positions[l.target].x);
    line.setAttribute("y2", positions[l.target].y);
    line.setAttribute("stroke","#555");
    line.setAttribute("stroke-width","2");
    svg.appendChild(line);
  });

  data.nodes.forEach(n=>{

    const r = 20 + (degree[n.id]/maxDegree)*40;

    let color = "#2e6da4";
    if(maxBet > 0){
      const intensity = betweenness[n.id]/maxBet;
      const red = Math.floor(255*intensity);
      const blue = Math.floor(255*(1-intensity));
      color = `rgb(${red},0,${blue})`;
    }

    const circle = document.createElementNS("http://www.w3.org/2000/svg","circle");
    circle.setAttribute("cx", positions[n.id].x);
    circle.setAttribute("cy", positions[n.id].y);
    circle.setAttribute("r", r);
    circle.setAttribute("fill", color);
    circle.setAttribute("stroke","#222");
    circle.setAttribute("stroke-width","2");

    svg.appendChild(circle);

    const label = document.createElementNS("http://www.w3.org/2000/svg","text");
    label.setAttribute("x", positions[n.id].x);
    label.setAttribute("y", positions[n.id].y+4);
    label.setAttribute("text-anchor","middle");
    label.setAttribute("fill","#fff");
    label.setAttribute("font-size","12");
    label.textContent = n.name;

    svg.appendChild(label);

  });

  document.getElementById("metrics").innerText =
    "Nodes: " + data.nodes.length +
    " | Edges: " + data.links.length +
    " | Avg Degree: " +
    (Object.values(degree).reduce((a,b)=>a+b,0)/data.nodes.length).toFixed(2) +
    " | Density: " +
    ( (2*data.links.length)/(data.nodes.length*(data.nodes.length-1)) ).toFixed(3);

}

render();

</script>

</body>
</html>
