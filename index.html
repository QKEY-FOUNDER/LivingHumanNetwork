<script>
fetch('data/living-human-network-v2.1.json')
    .then(response => response.json())
    .then(data => {

        const nodesContainer = document.getElementById('nodes');

        // Render Nodes
        data.nodes.forEach(node => {
            const div = document.createElement('div');
            div.className = 'node';
            div.innerHTML = "<strong>" + node.label + "</strong> (" + node.category + ")";
            div.id = node.id;
            nodesContainer.appendChild(div);
        });

        // Render Relationships
        const relationsTitle = document.createElement('h2');
        relationsTitle.innerText = "Relationships";
        nodesContainer.appendChild(relationsTitle);

        data.relationships.forEach(rel => {
            const relationDiv = document.createElement('div');
            relationDiv.style.margin = "5px 0";
            relationDiv.innerHTML =
                rel.source + " → " + rel.target +
                " (" + rel.type + ", weight: " + rel.weight + ")";
            nodesContainer.appendChild(relationDiv);
        });

    })
    .catch(error => {
        console.error('Error loading JSON:', error);
    });
</script>
