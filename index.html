<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LivingHumanNetwork v4.0 — Temporal Evolution</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #d8ccb0;
  text-align: center;
}
h1 { margin-top: 20px; }
#controls { margin: 10px; }
svg { background: #d8ccb0; }
</style>
</head>
<body>

<h1>LivingHumanNetwork v4.0 — Temporal Evolution</h1>

<div id="controls">
  <input type="range" id="timeSlider" min="0" max="1" step="1" value="0">
  <span id="timeLabel">t = 0</span>
</div>

<div id="metrics"></div>

<svg id="network" width="800" height="600"></svg>

<script>

const timeline = [
{
  t:0,
  nodes:[
    {id:"001",label:"Mihail"},
    {id:"002",label:"Natalia"}
  ],
  edges:[
    {source:"002",target:"001"}
  ]
},
{
  t:1,
  nodes:[
    {id:"001",label:"Mihail"},
    {id:"002",label:"Natalia"},
    {id:"003",label:"Mentor"}
  ],
  edges:[
    {source:"002",target:"001"},
    {source:"003",target:"001"}
  ]
}
];

const slider = document.getElementById("timeSlider");
slider.max = timeline.length - 1;

slider.addEventListener("input", () => {
  document.getElementById("timeLabel").innerText = "t = " + slider.value;
  render(parseInt(slider.value));
});

function calculateMetrics(nodes, edges) {
  const degree = {};
  nodes.forEach(n => degree[n.id] = 0);
  edges.forEach(e => {
    degree[e.source]++;
    degree[e.target]++;
  });

  const n = nodes.length;
  const m = edges.length;
  const avgDegree = n > 0 ? (2*m)/n : 0;
  const density = n > 1 ? (2*m)/(n*(n-1)) : 0;

  return {degree, avgDegree, density};
}

function calculateBetweenness(nodes, edges) {
  const score = {};
  nodes.forEach(n => score[n.id] = 0);

  nodes.forEach(a => {
    nodes.forEach(b => {
      if(a.id !== b.id) {
        edges.forEach(e => {
          if(e.source === a.id && e.target === b.id) {
            score[a.id] += 1;
          }
        });
      }
    });
  });

  return score;
}

function normalize(values) {
  const arr = Object.values(values);
  const max = Math.max(...arr);
  if(max === 0) return values;
  const normalized = {};
  for(let k in values) {
    normalized[k] = values[k] / max;
  }
  return normalized;
}

function render(tIndex) {

  const data = timeline[tIndex];
  const svg = document.getElementById("network");
  svg.innerHTML = "";

  const {degree, avgDegree, density} = calculateMetrics(data.nodes, data.edges);
  let btw = calculateBetweenness(data.nodes, data.edges);
  btw = normalize(btw);

  const centerX = 400;
  const centerY = 300;
  const radius = 160;

  data.nodes.forEach((node, i) => {
    const angle = (i / data.nodes.length) * 2 * Math.PI;
    node.x = centerX + radius * Math.cos(angle);
    node.y = centerY + radius * Math.sin(angle);
  });

  data.edges.forEach(e => {
    const source = data.nodes.find(n => n.id === e.source);
    const target = data.nodes.find(n => n.id === e.target);

    const line = document.createElementNS("http://www.w3.org/2000/svg","line");
    line.setAttribute("x1", source.x);
    line.setAttribute("y1", source.y);
    line.setAttribute("x2", target.x);
    line.setAttribute("y2", target.y);
    line.setAttribute("stroke","#555");
    line.setAttribute("stroke-width","2");
    svg.appendChild(line);
  });

  data.nodes.forEach(node => {

    const circle = document.createElementNS("http://www.w3.org/2000/svg","circle");

    const size = 25 + (degree[node.id] * 18);

    const influence = btw[node.id] || 0;
    const red = Math.floor(255 * influence);
    const blue = 180 - Math.floor(150 * influence);

    const color = `rgb(${red},50,${blue})`;

    circle.setAttribute("cx", node.x);
    circle.setAttribute("cy", node.y);
    circle.setAttribute("r", size);
    circle.setAttribute("fill", color);
    circle.setAttribute("stroke","#333");
    circle.setAttribute("stroke-width","2");

    svg.appendChild(circle);

    const text = document.createElementNS("http://www.w3.org/2000/svg","text");
    text.setAttribute("x", node.x);
    text.setAttribute("y", node.y+5);
    text.setAttribute("text-anchor","middle");
    text.setAttribute("font-size","12");
    text.setAttribute("fill","#000");
    text.textContent = node.label;
    svg.appendChild(text);
  });

  document.getElementById("metrics").innerHTML =
    "Nodes: " + data.nodes.length +
    " | Edges: " + data.edges.length +
    " | Avg Degree: " + avgDegree.toFixed(2) +
    " | Density: " + density.toFixed(3);
}

render(0);

</script>

</body>
</html>
