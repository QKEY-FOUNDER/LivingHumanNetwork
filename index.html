<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LivingHumanNetwork</title>

<style>
body {
    margin: 0;
    background: #f2e6c9;
    font-family: Arial, sans-serif;
}

#title {
    padding: 20px;
    text-align: center;
    font-size: 24px;
}

svg {
    display: block;
    margin: 0 auto;
}
</style>
</head>

<body>

<div id="title">LivingHumanNetwork v2.1 — Adaptive Graph</div>

<svg width="900" height="600"></svg>

<script src="https://d3js.org/d3.v7.min.js"></script>

<script>
const width = 900;
const height = 600;

const svg = d3.select("svg");

fetch('data/living-human-network-v2.1.json')
.then(response => response.json())
.then(data => {

    const simulation = d3.forceSimulation(data.nodes)
        .force("link", d3.forceLink(data.relationships)
            .id(d => d.id)
            .distance(150)
        )
        .force("charge", d3.forceManyBody().strength(-300))
        .force("center", d3.forceCenter(width / 2, height / 2));

    const link = svg.append("g")
        .selectAll("line")
        .data(data.relationships)
        .enter()
        .append("line")
        .attr("stroke", "#444")
        .attr("stroke-width", d => d.weight * 5);

    const node = svg.append("g")
        .selectAll("circle")
        .data(data.nodes)
        .enter()
        .append("circle")
        .attr("r", 30)
        .attr("fill", "gold")
        .attr("stroke", "#8c6a00")
        .attr("stroke-width", 2)
        .call(d3.drag()
            .on("start", dragstarted)
            .on("drag", dragged)
            .on("end", dragended)
        );

    const labels = svg.append("g")
        .selectAll("text")
        .data(data.nodes)
        .enter()
        .append("text")
        .text(d => d.label)
        .attr("text-anchor", "middle")
        .attr("font-size", 12)
        .attr("font-weight", "bold");

    simulation.on("tick", () => {
        link
            .attr("x1", d => d.source.x)
            .attr("y1", d => d.source.y)
            .attr("x2", d => d.target.x)
            .attr("y2", d => d.target.y);

        node
            .attr("cx", d => d.x)
            .attr("cy", d => d.y);

        labels
            .attr("x", d => d.x)
            .attr("y", d => d.y + 4);
    });

    function dragstarted(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
    }

    function dragged(event, d) {
        d.fx = event.x;
        d.fy = event.y;
    }

    function dragended(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null;
        d.fy = null;
    }

});
</script>

</body>
</html>
