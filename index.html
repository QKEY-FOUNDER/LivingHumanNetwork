<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LivingHumanNetwork</title>

<style>
body {
    margin: 0;
    background: #f2e6c9;
    font-family: Arial, sans-serif;
}

#title {
    padding: 20px;
    text-align: center;
    font-size: 24px;
}

svg {
    display: block;
    margin: 0 auto;
}
</style>
</head>

<body>

<div id="title">LivingHumanNetwork v2.1 — Louvain Communities</div>

<svg width="900" height="600"></svg>

<script type="module">

import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
import Graph from "https://cdn.jsdelivr.net/npm/graphology@0.25.1/+esm";
import louvain from "https://cdn.jsdelivr.net/npm/graphology-communities-louvain@2.0.2/+esm";

const width = 900;
const height = 600;
const svg = d3.select("svg");

fetch('data/living-human-network-v2.1.json')
.then(response => response.json())
.then(data => {

    const graph = new Graph();

    data.nodes.forEach(node => {
        graph.addNode(node.id);
    });

    data.relationships.forEach(rel => {
        graph.addEdge(rel.source, rel.target);
    });

    const communities = louvain(graph);

    const color = d3.scaleOrdinal(d3.schemeCategory10);

    const simulation = d3.forceSimulation(data.nodes)
        .force("link", d3.forceLink(data.relationships)
            .id(d => d.id)
            .distance(150)
        )
        .force("charge", d3.forceManyBody().strength(-400))
        .force("center", d3.forceCenter(width / 2, height / 2));

    const link = svg.append("g")
        .selectAll("line")
        .data(data.relationships)
        .enter()
        .append("line")
        .attr("stroke", "#999")
        .attr("stroke-width", 2);

    const node = svg.append("g")
        .selectAll("circle")
        .data(data.nodes)
        .enter()
        .append("circle")
        .attr("r", 30)
        .attr("fill", d => color(communities[d.id]))
        .attr("stroke", "#333")
        .attr("stroke-width", 2)
        .call(d3.drag()
            .on("start", dragstarted)
            .on("drag", dragged)
            .on("end", dragended)
        );

    const labels = svg.append("g")
        .selectAll("text")
        .data(data.nodes)
        .enter()
        .append("text")
        .text(d => d.label)
        .attr("text-anchor", "middle")
        .attr("font-size", 12)
        .attr("font-weight", "bold");

    simulation.on("tick", () => {
        link
            .attr("x1", d => d.source.x)
            .attr("y1", d => d.source.y)
            .attr("x2", d => d.target.x)
            .attr("y2", d => d.target.y);

        node
            .attr("cx", d => d.x)
            .attr("cy", d => d.y);

        labels
            .attr("x", d => d.x)
            .attr("y", d => d.y + 4);
    });

    function dragstarted(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
    }

    function dragged(event, d) {
        d.fx = event.x;
        d.fy = event.y;
    }

    function dragended(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null;
        d.fy = null;
    }

});

</script>

</body>
</html>
