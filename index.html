<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LivingHumanNetwork</title>

<script src="https://d3js.org/d3.v7.min.js"></script>

<style>
body {
    margin: 0;
    background: #f2e6c9;
    font-family: Arial, sans-serif;
}

#title {
    padding: 20px;
    text-align: center;
    font-size: 24px;
}

#metrics {
    text-align: center;
    margin-bottom: 20px;
    font-size: 14px;
}

svg {
    display: block;
    margin: 0 auto;
}
</style>
</head>

<body>

<div id="title">LivingHumanNetwork v3.1 — Stable Analytical View</div>
<div id="metrics"></div>
<svg width="900" height="600"></svg>

<script>

const width = 900;
const height = 600;

const svg = d3.select("svg");

fetch('data/living-human-network-v2.1.json')
.then(response => response.json())
.then(data => {

    // Grau
    const degree = {};
    data.nodes.forEach(n => degree[n.id] = 0);
    data.relationships.forEach(r => {
        degree[r.source] += 1;
        degree[r.target] += 1;
    });

    const maxDegree = Math.max(...Object.values(degree));

    const radiusScale = d3.scaleLinear()
        .domain([0, maxDegree])
        .range([20, 60]);

    // Métricas simples
    const n = data.nodes.length;
    const m = data.relationships.length;
    const density = ((2*m)/(n*(n-1))).toFixed(3);
    const avgDegree = (Object.values(degree).reduce((a,b)=>a+b,0)/n).toFixed(2);

    document.getElementById("metrics").innerHTML =
        `Nodes: ${n} | Edges: ${m} | Avg Degree: ${avgDegree} | Density: ${density}`;

    const simulation = d3.forceSimulation(data.nodes)
        .force("link", d3.forceLink(data.relationships)
            .id(d => d.id)
            .distance(150))
        .force("charge", d3.forceManyBody().strength(-400))
        .force("center", d3.forceCenter(width/2, height/2));

    const link = svg.append("g")
        .selectAll("line")
        .data(data.relationships)
        .enter()
        .append("line")
        .attr("stroke", "#999")
        .attr("stroke-width", 2);

    const node = svg.append("g")
        .selectAll("circle")
        .data(data.nodes)
        .enter()
        .append("circle")
        .attr("r", d => radiusScale(degree[d.id]))
        .attr("fill", "#d4a017")
        .attr("stroke", "#333")
        .attr("stroke-width", 2)
        .call(d3.drag()
            .on("start", dragstarted)
            .on("drag", dragged)
            .on("end", dragended));

    const labels = svg.append("g")
        .selectAll("text")
        .data(data.nodes)
        .enter()
        .append("text")
        .text(d => d.label)
        .attr("text-anchor", "middle")
        .attr("font-size", 12)
        .attr("font-weight", "bold");

    simulation.on("tick", () => {
        link
            .attr("x1", d => d.source.x)
            .attr("y1", d => d.source.y)
            .attr("x2", d => d.target.x)
            .attr("y2", d => d.target.y);

        node
            .attr("cx", d => d.x)
            .attr("cy", d => d.y);

        labels
            .attr("x", d => d.x)
            .attr("y", d => d.y + 4);
    });

    function dragstarted(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
    }

    function dragged(event, d) {
        d.fx = event.x;
        d.fy = event.y;
    }

    function dragended(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null;
        d.fy = null;
    }

});
</script>

</body>
</html>
